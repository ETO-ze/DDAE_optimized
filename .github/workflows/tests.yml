name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numerical:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy scipy pyyaml
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  keras-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pyyaml tensorflow
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          CUDA_VISIBLE_DEVICES: '-1'
          TF_NUM_INTRAOP_THREADS: '1'
          TF_NUM_INTEROP_THREADS: '1'
